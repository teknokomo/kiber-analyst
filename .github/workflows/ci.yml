name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

jobs:
  migration-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install migration runner test dependencies
        run: python -m pip install -e '.[test,db]'
      - name: Exercise migrations against disposable PostgreSQL
        env:
          KIBER_ANALYST_MIGRATION_TEST_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: pytest -v tests/test_migration_runner_postgres.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install -e .
          python -m pip install -e '.[test,db,providers,mcp]'
      - name: Public release and secret scan
        run: python scripts/public_release_scan.py
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Compile
        run: python -m compileall -q src
