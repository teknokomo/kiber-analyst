[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kiber-analyst"
version = "0.1.0"
description = "A Python toolkit for importing and searching structured source archives"
readme = "README.md"
license = "LicenseRef-Omsk-Open-License-0.2.0"
license-files = ["LICENSE", "LICENSE-RU.md"]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "ijson>=3.3,<4",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
db = ["psycopg[binary]>=3.2,<4"]
embedding = ["google-genai>=2.34,<3", "httpx[socks]>=0.28.1,<1", "PyYAML>=6,<7"]
asr = ["groq>=0.37,<1", "httpx[socks]>=0.28.1,<1", "PyYAML>=6,<7"]
providers = ["google-genai>=2.34,<3", "groq>=0.37,<1", "httpx[socks]>=0.28.1,<1", "PyYAML>=6,<7"]
test = ["pytest>=8,<10", "ruff>=0.14,<1"]
mcp = [
  "mcp==1.30.0",
  "uvicorn==0.54.0",
  "starlette==1.10.0",
  "sse-starlette==3.6.0",
  "httpx-sse==0.4.3",
  "pydantic-settings==2.16.2",
  "psycopg[binary]==3.3.8",
]

[project.scripts]
kiber-analyst = "kiber_analyst.cli:main"
kiber-analyst-worker = "kiber_analyst.worker:_main"
kiber-analyst-broker = "kiber_analyst.broker:main"
kiber-analyst-broker-client = "kiber_analyst.broker_client:main"
kiber-analyst-queue-backup = "kiber_analyst.queue_backup:main"
kiber-analyst-backup = "kiber_analyst.backup:main"
kiber-analyst-queue-restore = "kiber_analyst.queue_restore:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
