# Profile order is the round-robin order for each audio item.
# Credentials and proxy URLs remain in their protected env files.
profiles:
  - groq_asr
  - groq_asr_2

# One cycle visits every active profile once for the same audio file.
max_cycles: 5
request_timeout_seconds: 900
max_runtime_seconds: 2700
backoff_initial_seconds: 10
backoff_max_seconds: 120

# Keep the glossary short; Groq's transcription prompt has a 224-token limit.
prompt: >-
  Русская речь. Сохраняй точные написания имён собственных и специальных терминов.
